SectionVerb {
    EnableSequence [
        cset "name='I2S1_CH1 DL1_CH1 Switch' 0"
        cset "name='I2S1_CH2 DL1_CH2 Switch' 0"
        cset "name='I2S3_CH1 DL1_CH1 Switch' 1"
        cset "name='I2S3_CH2 DL1_CH2 Switch' 1"
        cset "name='Speakers Switch' 1"
        cset "name='Headphone Switch' 0"
        cset "name='2-0034 PCM Playback Volume' 0"
        cset "name='2-0035 PCM Playback Volume' 0"
        cset "name='2-0036 PCM Playback Volume' 0"
        cset "name='2-0037 PCM Playback Volume' 0"
        cset "name='6-0034 PCM Playback Volume' 0"
        cset "name='6-0035 PCM Playback Volume' 0"
        cset "name='6-0036 PCM Playback Volume' 0"
        cset "name='6-0037 PCM Playback Volume' 0"
    ]
    DisableSequence [
        cset "name='Speakers Switch' 0"
        cset "name='Headphone Switch' 0"
    ]
    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Internal Speakers"

    ConflictingDevice [
        "Headphones"
    ]

    EnableSequence [
        cset "name='Headphone Switch' 0"
        cset "name='Speakers Switch' 1"
    ]

    DisableSequence [
        cset "name='Speakers Switch' 0"
    ]

    Value {
        PlaybackPriority 300
        PlaybackPCM "hw:${CardId},0"
        PlaybackMixerElem "Speakers"
    }
}

SectionDevice."Headphones" {
    Comment "Headphones"

    ConflictingDevice [
        "Speaker"
    ]

    EnableSequence [
        cset "name='Speakers Switch' 0"
        cset "name='Headphone Switch' 1"
    ]

    DisableSequence [
        cset "name='Headphone Switch' 0"
    ]

    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackVolume "name='Mt6366 Headphone Volume'"
        JackControl "Headphone Jack"
    }
}
