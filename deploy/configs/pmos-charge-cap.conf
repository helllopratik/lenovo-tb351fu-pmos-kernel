# Charge cap for the Lenovo TB351FU.
# LIMIT is "full" or a percentage in 50-100.  80 keeps the battery in its
# comfortable range; charging resumes at LIMIT-5.
LIMIT=80
# SC8989x input current limit in uA.  900 mA lets the tablet charge on a
# 500 mA SDP port instead of merely slowing the discharge.
INPUT_UA=900000
