# pmos-pen-daemon — Lenovo Tab Pen Plus gesture actions
#
# The pen reports single/double/triple/long/press as Consumer usages
# 0x0c0600-0x0c0604 (see ANDROID_STOCK_ANALYSIS.md §6).  Actions are either a
# key injected through /dev/uinput (MODE) or a shell command (per gesture).

# media        : single play/pause, double next, triple previous, long mute
# presentation : single page down, double page up
# camera       : single volume down (shutter), double open camera
# none         : do nothing (still logs the gesture)
MODE=media

# Optional per-gesture command overrides.  When set, the command runs instead
# of the MODE key.  PEN_GESTURE and PEN_USAGE are exported to the command.
#SINGLE_CMD=notify-send "Pen" "single click"
#DOUBLE_CMD=
#TRIPLE_CMD=
#LONG_CMD=
#PRESS_CMD=
