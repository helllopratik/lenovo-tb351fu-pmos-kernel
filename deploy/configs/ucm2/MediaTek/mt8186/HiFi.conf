SectionVerb {
    EnableSequence [
        cset "name='I2S1_CH1 DL1_CH1 Switch' 0"
        cset "name='I2S1_CH2 DL1_CH2 Switch' 0"
        cset "name='I2S3_CH1 DL1_CH1 Switch' 1"
        cset "name='I2S3_CH2 DL1_CH2 Switch' 1"
        cset "name='Speakers Switch' 1"
        cset "name='Headphone Switch' 0"
        cset "name='ADDA_DL_CH1 DL1_CH1 Switch' 0"
        cset "name='ADDA_DL_CH2 DL1_CH2 Switch' 0"
        cset "name='ADDA_UL_Mux' MTKAIF"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 1"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 1"
        cset "name='2-0034 PCM Playback Volume' 0"
        cset "name='2-0035 PCM Playback Volume' 0"
        cset "name='2-0036 PCM Playback Volume' 0"
        cset "name='2-0037 PCM Playback Volume' 0"
        cset "name='6-0034 PCM Playback Volume' 0"
        cset "name='6-0035 PCM Playback Volume' 0"
        cset "name='6-0036 PCM Playback Volume' 0"
        cset "name='6-0037 PCM Playback Volume' 0"
    ]
    DisableSequence [
        cset "name='Speakers Switch' 0"
        cset "name='Headphone Switch' 0"
        cset "name='ADDA_DL_CH1 DL1_CH1 Switch' 0"
        cset "name='ADDA_DL_CH2 DL1_CH2 Switch' 0"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 0"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 0"
    ]
    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Internal Speakers"

    ConflictingDevice [
        "Headphones"
    ]

    EnableSequence [
        cset "name='Headphone Switch' 0"
        cset "name='ADDA_DL_CH1 DL1_CH1 Switch' 0"
        cset "name='ADDA_DL_CH2 DL1_CH2 Switch' 0"
        cset "name='I2S3_CH1 DL1_CH1 Switch' 1"
        cset "name='I2S3_CH2 DL1_CH2 Switch' 1"
        cset "name='Speakers Switch' 1"
    ]

    DisableSequence [
        cset "name='Speakers Switch' 0"
    ]

    Value {
        PlaybackPriority 300
        PlaybackPCM "hw:${CardId},0"
        PlaybackMixerElem "Speakers"
    }
}

SectionDevice."Headphones" {
    Comment "Headphones"

    ConflictingDevice [
        "Speaker"
    ]

    EnableSequence [
        cset "name='Speakers Switch' 0"
        cset "name='Headphone Switch' 1"
        cset "name='ADDA_DL_CH1 DL1_CH1 Switch' 1"
        cset "name='ADDA_DL_CH2 DL1_CH2 Switch' 1"
    ]

    DisableSequence [
        cset "name='Headphone Switch' 0"
        cset "name='ADDA_DL_CH1 DL1_CH1 Switch' 0"
        cset "name='ADDA_DL_CH2 DL1_CH2 Switch' 0"
    ]

    Value {
        PlaybackPriority 500
        PlaybackPCM "hw:${CardId},0"
        PlaybackVolume "name='Mt6366 Headphone Volume'"
        JackControl "Headphone Jack"
    }
}

# Capture: bottom/main analog mic on AIN0.
# Capture_1 is PCM device 9 on the mt6789-mt6366 card: front-end links are
# Playback_1, Playback_12, Playback_2..8 (devices 0..8), then Capture_1 (9).
# The codec controls are the real kcontrol names exposed by the mt6366
# driver: "Mt6366 Mic Type Mux", "Mt6366 ADC L/R Mux", "Mt6366 PGA L/R Mux",
# and "Mt6366 PGA Volume".
SectionDevice."Mic" {
    Comment "Built-in Microphone"

    ConflictingDevice [
        "Back Mic"
        "Headset Mic"
    ]

    EnableSequence [
        cset "name='Mt6366 Mic Type Mux' ACC"
        cset "name='Mt6366 ADC L Mux' 'Left Preamplifier'"
        cset "name='Mt6366 ADC R Mux' 'Right Preamplifier'"
        cset "name='Mt6366 PGA L Mux' AIN0"
        cset "name='Mt6366 PGA R Mux' AIN0"
        cset "name='ADDA_UL_Mux' MTKAIF"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 1"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 1"
    ]

    DisableSequence [
        cset "name='Mt6366 ADC L Mux' Idle"
        cset "name='Mt6366 ADC R Mux' Idle"
        cset "name='Mt6366 PGA L Mux' None"
        cset "name='Mt6366 PGA R Mux' None"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 0"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 0"
    ]

    Value {
        CapturePriority 300
        CapturePCM "hw:${CardId},9"
        CaptureChannels 2
        CaptureVolume "name='Mt6366 PGA Volume'"
    }
}

# Capture: rear/back analog mic on AIN2.
SectionDevice."Back Mic" {
    Comment "Built-in Back Microphone"

    ConflictingDevice [
        "Mic"
        "Headset Mic"
    ]

    EnableSequence [
        cset "name='Mt6366 Mic Type Mux' ACC"
        cset "name='Mt6366 ADC L Mux' 'Left Preamplifier'"
        cset "name='Mt6366 ADC R Mux' 'Right Preamplifier'"
        cset "name='Mt6366 PGA L Mux' AIN2"
        cset "name='Mt6366 PGA R Mux' AIN2"
        cset "name='ADDA_UL_Mux' MTKAIF"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 1"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 1"
    ]

    DisableSequence [
        cset "name='Mt6366 ADC L Mux' Idle"
        cset "name='Mt6366 ADC R Mux' Idle"
        cset "name='Mt6366 PGA L Mux' None"
        cset "name='Mt6366 PGA R Mux' None"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 0"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 0"
    ]

    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},9"
        CaptureChannels 2
        CaptureVolume "name='Mt6366 PGA Volume'"
    }
}

# Capture: headset mic on AIN1, biased by MICBIAS1 at 2.6 V.
# The machine driver registers the mic jack as "Headset Mic Jack" (see
# sound/soc/mediatek/mt8186/mt8186-mt6366.c), so gate this device on that
# control instead of leaving a dead microphone selectable when unplugged.
SectionDevice."Headset Mic" {
    Comment "Headset Microphone"

    ConflictingDevice [
        "Mic"
        "Back Mic"
    ]

    EnableSequence [
        cset "name='Mt6366 Mic Type Mux' ACC"
        cset "name='Mt6366 ADC L Mux' 'Left Preamplifier'"
        cset "name='Mt6366 ADC R Mux' 'Right Preamplifier'"
        cset "name='Mt6366 PGA L Mux' AIN1"
        cset "name='Mt6366 PGA R Mux' AIN1"
        cset "name='ADDA_UL_Mux' MTKAIF"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 1"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 1"
    ]

    DisableSequence [
        cset "name='Mt6366 ADC L Mux' Idle"
        cset "name='Mt6366 ADC R Mux' Idle"
        cset "name='Mt6366 PGA L Mux' None"
        cset "name='Mt6366 PGA R Mux' None"
        cset "name='UL1_CH1 ADDA_UL_CH1 Switch' 0"
        cset "name='UL1_CH2 ADDA_UL_CH2 Switch' 0"
    ]

    Value {
        CapturePriority 500
        CapturePCM "hw:${CardId},9"
        CaptureChannels 1
        CaptureVolume "name='Mt6366 PGA Volume'"
        JackControl "Headset Mic Jack"
    }
}
