# Keep kernel faults from silently rebooting the tablet during hardware
# bring-up.  This must sort after 99-panic.conf: systemd-sysctl applies
# sysctl.d files in lexical order, and 99-panic.conf enables panic reboot.
kernel.panic = 0
kernel.panic_on_oops = 0
kernel.hung_task_panic = 0
kernel.softlockup_panic = 0
